# 2. articles listesine yalnız coverage: tam + status: dogrulandi + yayin: yayinlandi olan
#    [L0]'lar girer. Üçünden biri eksikse makale IR'ye GİRMEZ (dürüst boşluk > yanlış cevap).
# 3. panel/coverage/availability [L0].applies'tan BİREBİR taşınır (üç eksen — bkz. L0 şablonu).
# 4. Bu manifest Proje B'ye (chatbot) teslim edilir — Ş8 kontratının somut çıktısıdır.
